<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApoioSênior - Pedir Ajuda Ficou Fácil</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #1a1a1a;
            --primary-red: #d9534f;
            --primary-blue: #0275d8;
            --primary-green: #5cb85c;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            font-size: 22px; /* Fonte ampliada por padrão */
        }

        header {
            text-align: center;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 32px; }

        /* Botão Principal de Emergência */
        .btn-sos {
            background-color: var(--primary-red);
            color: white;
            width: 100%;
            padding: 35px 20px;
            font-size: 36px;
            font-weight: bold;
            border: 4px solid #a94442;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            margin-bottom: 30px;
        }

        .btn-sos:active {
            transform: scale(0.98);
        }

        /* Seções de Opções */
        .grid-ajuda {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .grid-ajuda { grid-template-columns: 1fr; }
        }

        .card-opcao {
            background-color: var(--card-bg);
            border: 3px solid #ccc;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card-opcao:hover { border-color: var(--primary-blue); }
        .card-opcao img { width: 60px; height: 60px; margin-bottom: 10px; }
        .card-opcao h3 { margin: 10px 0 0 0; font-size: 26px; }

        /* Modal / Alerta */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 80%;
        }

        .btn-fechar {
            background-color: #333;
            color: white;
            padding: 15px 30px;
            font-size: 22px;
            border: none;
            border-radius: 10px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Apoio Sênior</h1>
        <p>Clique onde precisa de ajuda</p>
    </header>

    <main>
        <!-- Botão SOS Primário -->
        <button class="btn-sos" onclick="solicitarSOS()" aria-label="Botão de emergência SOS">
            🚨 PEDIR SOCORRO AGORA
        </button>

        <h2>Outros Tipos de Ajuda</h2>
        
        <div class="grid-ajuda">
            <div class="card-opcao" onclick="pedirAjuda('Remédios ou Farmácia')">
                <span style="font-size: 50px;">💊</span>
                <h3>Preciso de Remédios</h3>
            </div>
            
            <div class="card-opcao" onclick="pedirAjuda('Compras de Mercado')">
                <span style="font-size: 50px;">🛒</span>
                <h3>Compras de Mercado</h3>
            </div>

            <div class="card-opcao" onclick="pedirAjuda('Alguém para conversar')">
                <span style="font-size: 50px;">🗣️</span>
                <h3>Quer conversar</h3>
            </div>

            <div class="card-opcao" onclick="pedirAjuda('Apoio com Transporte')">
                <span style="font-size: 50px;">🚗</span>
                <h3>Preciso de Transporte</h3>
            </div>
        </div>
    </main>

    <!-- Modal de Confirmação -->
    <div id="modalAviso" class="modal">
        <div class="modal-content">
            <h2 id="modalTitulo">Enviando Pedido...</h2>
            <p id="modalMensagem">Estamos avisando seus contatos de confiança.</p>
            <button class="btn-fechar" onclick="fecharModal()">Fechar / Cancelar</button>
        </div>
    </div>

    <script>
        // Função de sintetizador de voz (Lê para o idoso)
        function falarTexto(texto) {
            if ('speechSynthesis' in window) {
                const fala = new SpeechSynthesisUtterance(texto);
                fala.lang = 'pt-BR';
                fala.rate = 0.9; // Fala um pouco mais devagar
                window.speechSynthesis.speak(fala);
            }
        }

        function solicitarSOS() {
            const msg = "Sinal de Emergência acionado! Enviando sua localização para a família e serviços de emergência.";
            document.getElementById('modalTitulo').innerText = "🚨 SOCORRO SOLICITADO";
            document.getElementById('modalMensagem').innerText = msg;
            document.getElementById('modalAviso').style.display = 'flex';
            falarTexto(msg);
        }

        function pedirAjuda(tipo) {
            const msg = `Você pediu ajuda com: ${tipo}. Um voluntário ou familiar entrará em contato em breve.`;
            document.getElementById('modalTitulo').innerText = "Pedido Registrado";
            document.getElementById('modalMensagem').innerText = msg;
            document.getElementById('modalAviso').style.display = 'flex';
            falarTexto(msg);
        }

        function fecharModal() {
            document.getElementById('modalAviso').style.display = 'none';
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }
    </script>
</body>
</html>
